<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Raymond Zhang | Magic</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // MIT License
      // Redirects deep links (e.g. /about) on GitHub Pages back to index.html
      // with the original path encoded in the query string. The companion
      // script in index.html restores the URL using history.replaceState so
      // BrowserRouter can pick it up without a hash in the URL.
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
